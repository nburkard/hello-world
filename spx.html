<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SPX Tracker</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4 select-none">

    <div class="bg-gray-800 border border-gray-700 rounded-2xl shadow-2xl p-6 w-full max-w-sm">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white">S&P 500 Index</h1>
                <p class="text-xs text-gray-400">Updates every 10 seconds</p>
            </div>
            <span class="bg-blue-900 text-blue-300 text-xs font-semibold px-2 py-0.5 rounded border border-blue-700">^SPX</span>
        </div>

        <div class="mb-5">
            <div class="text-xs font-medium text-gray-400 uppercase tracking-wider">Current Price</div>
            <div class="text-4xl font-black text-green-400 tracking-tight" id="current-price">Loading...</div>
        </div>

        <div class="mb-5 bg-gray-950 p-2 rounded-xl border border-gray-800">
            <canvas id="sparkline" width="340" height="70" class="w-full"></canvas>
        </div>

        <div class="space-y-2.5">
            <div class="flex justify-between items-center bg-gray-900/60 p-3 rounded-xl border border-gray-700/50">
                <span class="text-xs font-bold text-orange-400 uppercase tracking-wider">-1.50%</span>
                <span id="level-150" class="text-base font-bold font-mono text-gray-200">--</span>
            </div>
            <div class="flex justify-between items-center bg-gray-900/60 p-3 rounded-xl border border-gray-700/50">
                <span class="text-xs font-bold text-orange-500 uppercase tracking-wider">-1.75%</span>
                <span id="level-175" class="text-base font-bold font-mono text-gray-200">--</span>
            </div>
            <div class="flex justify-between items-center bg-gray-900/60 p-3 rounded-xl border border-gray-700/50">
                <span class="text-xs font-bold text-red-500 uppercase tracking-wider">-2.00%</span>
                <span id="level-200" class="text-base font-bold font-mono text-gray-200">--</span>
            </div>
        </div>
        
        <div class="mt-5 pt-3 border-t border-gray-700 flex justify-between items-center text-[10px] text-gray-500 font-medium">
            <span id="status">Connecting...</span>
            <span id="timestamp">--:--:--</span>
        </div>
    </div>

    <script>
        console.log("[TRACKER-V5-ONLINE] Script initialization active.");

        const priceElement = document.getElementById('current-price');
        const level150Element = document.getElementById('level-150');
        const level175Element = document.getElementById('level-175');
        const level200Element = document.getElementById('level-200');
        const statusElement = document.getElementById('status');
        const timestampElement = document.getElementById('timestamp');
        const canvas = document.getElementById('sparkline');
        const ctx = canvas.getContext('2d');

        let priceHistory = [];
        const maxHistoryLength = 25;
        const formatter = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });

        function drawSparkline() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (priceHistory.length < 2) return;
            const min = Math.min(...priceHistory);
            const max = Math.max(...priceHistory);
            const range = max - min === 0 ? 1 : max - min;

            ctx.beginPath();
            ctx.strokeStyle = '#4ade80';
            ctx.lineWidth = 2.5;
            ctx.lineJoin = 'round';
            for (let i = 0; i < priceHistory.length; i++) {
                const x = (i / (maxHistoryLength - 1)) * canvas.width;
                const y = canvas.height - ((priceHistory[i] - min) / range) * (canvas.height - 16) - 8;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

async function fetchSpxPrice() {
  try {
    statusElement.textContent = 'Updating...';
    
    // Direct Yahoo Finance v8 chart API endpoint for S&P 500 (^GSPC)
    const targetUrl = 'https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?interval=1m&range=1d';
    const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);
    
    const response = await fetch(proxyUrl);
    if (!response.ok) throw new Error('Network response failed');
    
    const data = await response.json();
    const result = data?.chart?.result?.[0];
    const currentPrice = result?.meta?.regularMarketPrice;
    
    if (!currentPrice) throw new Error('Price data missing from API response');

    // Update UI elements
    priceElement.textContent = formatter.format(currentPrice);
    level150Element.textContent = formatter.format(currentPrice * 0.985);
    level175Element.textContent = formatter.format(currentPrice * 0.9825);
    level200Element.textContent = formatter.format(currentPrice * 0.98);

    const now = new Date();
    timestampElement.textContent = now.toTimeString().split(' ')[0];
    statusElement.textContent = 'Live';

    priceHistory.push(currentPrice);
    if (priceHistory.length > maxHistoryLength) priceHistory.shift();
    drawSparkline();
  } catch (e) {
    console.error("[TRACKER-V5-ERROR] Fetch failed: ", e);
    statusElement.textContent = 'Network Retry...';
  }
}
        
        fetchSpxPrice();
        setInterval(fetchSpxPrice, 10000);
    </script>
</body>
</html>
